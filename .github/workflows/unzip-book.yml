name: Unzip book.zip

# रिपोच्या मुख्य (root) फोल्डरमध्ये book.zip upload केली की ही फाईल आपोआप चालते,
# zip उघडते, आतल्या फाईल्स book/ फोल्डरमध्ये टाकते (जुन्या बदलते) आणि zip काढून टाकते.
on:
  push:
    branches: [main]
    paths:
      - "book.zip"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: unzip-book
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip and copy into book/
        run: |
          if [ ! -f book.zip ]; then
            echo "book.zip सापडली नाही — काही करायचं नाही."
            exit 0
          fi
          rm -rf /tmp/unz && mkdir /tmp/unz
          unzip -q -o book.zip -d /tmp/unz
          rm -rf /tmp/unz/__MACOSX
          SRC=/tmp/unz
          # zip च्या आत एकच "book" फोल्डर असेल तर त्याच्या आतल्या फाईल्स वापरा
          if [ -d /tmp/unz/book ] && [ "$(ls -A /tmp/unz | wc -l)" -eq 1 ]; then
            SRC=/tmp/unz/book
          fi
          mkdir -p book
          cp -a "$SRC"/. book/
          rm -f book.zip
          echo "--- book/ मधील फाईल्स ---"
          ls -la book

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "कोणताही बदल नाही."
          else
            git commit -m "Update book app from book.zip"
            git push
          fi

      - name: Trigger GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
