<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kalyan Pathlab — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b1440" />
<link rel="manifest" href="./manifest-admin.json" />
<link rel="icon" href="./icons/admin-icon-192.png" />
<link rel="apple-touch-icon" href="./icons/admin-icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./admin-style.css" />
</head>
<body>

<header class="admin-topbar">
  <img src="./icons/admin-logo.png" alt="Kalyan Pathlab Admin" class="admin-logo" />
  <div class="admin-title"><strong>Kalyan Pathlab — Admin</strong><span id="lastUpdated">Loading…</span></div>
  <select id="adminLangSelect" class="admin-lang-select" aria-label="Language">
    <option value="en">EN</option>
    <option value="mr">मर</option>
    <option value="hi">हि</option>
  </select>
  <button type="button" id="shareCustomerLinkBtn" class="icon-btn" aria-label="Share customer app link">📤</button>
  <button type="button" id="refreshBtn" class="icon-btn" aria-label="Refresh">🔄</button>
</header>

<nav class="admin-tabs">
  <button type="button" class="admin-tab active" data-tab="bookings" data-i18n="tab_bookings">📅 Bookings</button>
  <button type="button" class="admin-tab" data-tab="reviews" data-i18n="tab_reviews">⭐ Reviews</button>
  <button type="button" class="admin-tab" data-tab="tests" data-i18n="tab_tests">🧪 Tests</button>
  <button type="button" class="admin-tab" data-tab="patients" data-i18n="tab_patients">🔍 Find Patient</button>
</nav>

<div class="stat-row" id="statRow"></div>

<section id="tab-bookings" class="admin-section">
  <input type="search" id="bookingSearch" class="admin-search" placeholder="Search by name, phone, or test…" data-i18n-placeholder="search_bookings" />
  <div id="bookingList" class="admin-list"></div>
</section>

<section id="tab-reviews" class="admin-section" hidden>
  <div class="review-filter">
    <button type="button" class="filter-chip active" data-status="all" data-i18n="filter_all">All</button>
    <button type="button" class="filter-chip" data-status="Pending" data-i18n="filter_pending">Pending</button>
    <button type="button" class="filter-chip" data-status="Approved" data-i18n="filter_approved">Approved</button>
    <button type="button" class="filter-chip" data-status="Rejected" data-i18n="filter_rejected">Rejected</button>
  </div>
  <div id="reviewList" class="admin-list"></div>
</section>

<section id="tab-tests" class="admin-section" hidden>
  <button type="button" id="showAddTestBtn" class="btn btn-primary btn-block" data-i18n="add_new_test">+ Add New Test</button>
  <div id="addTestForm" class="add-test-form" hidden>
    <input type="text" id="testCategory" placeholder="Category (e.g. Diabetes Profile)" list="categoryList" data-i18n-placeholder="ph_category" />
    <datalist id="categoryList"></datalist>
    <input type="text" id="testName" placeholder="Test Name (e.g. HbA1c)" data-i18n-placeholder="ph_test_name" />
    <div class="two-col-inline">
      <input type="number" id="testMrp" placeholder="MRP ₹" data-i18n-placeholder="ph_mrp" />
      <input type="number" id="testPrice" placeholder="Discount Price ₹" data-i18n-placeholder="ph_price" />
    </div>
    <button type="button" id="saveTestBtn" class="btn btn-primary btn-block" data-i18n="save_test">Save Test</button>
    <button type="button" id="cancelTestBtn" class="link-btn" style="display:block;text-align:center;margin-top:8px" data-i18n="cancel">Cancel</button>
  </div>
  <input type="search" id="testSearchAdmin" class="admin-search" placeholder="Search tests…" style="margin-top:14px" data-i18n-placeholder="search_tests" />
  <div id="testListAdmin" class="admin-list"></div>
</section>

<section id="tab-patients" class="admin-section" hidden>
  <input type="tel" id="patientPhoneSearch" class="admin-search" placeholder="Enter 10-digit phone number…" data-i18n-placeholder="ph_phone_search" />
  <button type="button" id="patientSearchBtn" class="btn btn-primary btn-block" style="margin-top:10px" data-i18n="search_btn">Search</button>
  <div id="patientResult" style="margin-top:16px"></div>
</section>

<div id="toast" class="toast" hidden></div>
<script src="./admin.js"></script>
</body>
</html>
